[package]
name = "bifrost"
version = "0.0.7"
description = "Multi-rider session manager for EVE Frontier — per-rider sandboxed game client + browser + wallet, behind a single calm UI."
authors = ["valknarr <valknarr@pm.me>"]
license = "MIT"
edition = "2021"
rust-version = "1.77"
repository = "https://github.com/valknarr/bifrost"
homepage = "https://github.com/valknarr/bifrost"
documentation = "https://github.com/valknarr/bifrost#readme"
keywords = ["eve-frontier", "sandboxie", "multibox", "tauri", "gaming"]
categories = ["games", "gui"]
readme = "../README.md"

[lib]
name = "bifrost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Shell plugin: lets the frontend open external URLs via @tauri-apps/plugin-shell
# (used by external.ts when surfacing GitHub-release links). Permissions
# are restricted in capabilities/default.json to `shell:allow-open` only.
tauri-plugin-shell = "2"
# Updater plugin: lets Bifrost check a signed JSON manifest on
# GitHub Releases for a newer .exe, verify the signature against
# the bundled pubkey in tauri.conf.json, download, and prompt the
# user to restart into the new version. This is the desktop-app
# equivalent of "ship UI tweaks without users re-downloading the
# installer" — every modern app (Brave, Discord, VS Code) uses
# the same pattern. Setup steps are in `docs/RELEASING.md`.
tauri-plugin-updater = "2"
# Process plugin: needed by the updater flow to gracefully relaunch
# Bifrost after the new installer has run. Used solely for
# `relaunch()`; the rest of the plugin is gated to that one
# permission via `capabilities/default.json`.
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# Wraps cached favicon bytes as `data:` URLs the frontend can render
# without a custom asset-protocol scope.
base64 = "0.22"

[dev-dependencies]
# Auto-cleaning temp dirs for the cascading tests that exercise real
# disk paths (`prepare_profile`, version marker round-trips, config
# load_or_default). Keeps `cargo test` hermetic.
tempfile = "3"

[features]
# This feature is used for production builds where `devUrl` points to the
# bundled frontend; do not modify it!
custom-protocol = ["tauri/custom-protocol"]
