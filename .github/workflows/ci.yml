name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum-required workflow permissions. CI only reads the repo, so
# `contents: read` is enough. The default for older repos is often
# `write-all`, which the OpenSSF Scorecard flags as risky — this top-
# level pin overrides that for every job below.
permissions:
  contents: read

# Cancel superseded CI runs on the same branch — saves Actions minutes and
# means feedback on the latest push is what matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Faster compiles for CI. We're not measuring runtime perf here.
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets
        # -D warnings turns every clippy warning into an error so we
        # can't quietly regress the zero-warning baseline.
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --all-targets

      # `cargo audit` checks the Cargo.lock against the RustSec
      # advisory DB. Baseline triage (pre-public sweep) cleared all
      # CVEs — the only remaining advisories are GTK3 transitives
      # (Linux-only, Bifrost is Windows) which are ignored via
      # `src-tauri/audit.toml`. CI hard-fails on any NEW advisory so
      # a real CVE can't slip in unnoticed.
      #
      # Version pinned to 0.22.1+ because earlier versions (0.21.2,
      # which we used initially) can't parse CVSS 4.0 vector strings
      # — they abort the whole audit when ANY advisory in the DB
      # uses CVSS 4.0, even advisories for crates we don't depend on
      # (RUSTSEC-2026-0146 for anchor-lang is what tripped us). The
      # `--locked` ensures the install matches the lockfile shipped
      # with cargo-audit, so we get a deterministic install.
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit --version 0.22.1
          cargo audit

  frontend:
    name: Frontend (svelte-check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      # `pnpm audit` checks the lockfile against npm's advisory DB.
      # `--prod` skips dev-only deps (vite, svelte-check, etc.) so we
      # only block on advisories that affect what we ship. Hard-fail
      # now that the pre-public baseline is clean (0 advisories
      # across 144 deps as of the launch sweep).
      - name: pnpm audit
        run: pnpm audit --prod
