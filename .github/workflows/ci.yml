name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum-required workflow permissions. CI only reads the repo, so
# `contents: read` is enough. The default for older repos is often
# `write-all`, which the OpenSSF Scorecard flags as risky — this top-
# level pin overrides that for every job below.
permissions:
  contents: read

# Cancel superseded CI runs on the same branch — saves Actions minutes and
# means feedback on the latest push is what matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Faster compiles for CI. We're not measuring runtime perf here.
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets
        # -D warnings turns every clippy warning into an error so we
        # can't quietly regress the zero-warning baseline.
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --all-targets

      # `cargo audit` checks the Cargo.lock against the RustSec
      # advisory DB. `continue-on-error` keeps the run green while
      # we establish a clean baseline — once we've triaged any
      # findings, drop this line so a new advisory fails the build.
      - name: cargo audit
        continue-on-error: true
        run: |
          cargo install --locked cargo-audit --version 0.21.2
          cargo audit

  frontend:
    name: Frontend (svelte-check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      # `pnpm audit` checks the lockfile against npm's advisory DB.
      # `--prod` skips dev-only deps (vite, svelte-check, etc.) so we
      # only block on advisories that affect what we ship. Soft-failed
      # for the same reason as `cargo audit` above — flip to a hard
      # fail once the baseline is clean.
      - name: pnpm audit
        continue-on-error: true
        run: pnpm audit --prod
