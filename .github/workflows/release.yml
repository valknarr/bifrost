# Release workflow.
#
# Triggered manually OR by pushing a `v*` tag (e.g. `v0.1.0`). Builds
# the Windows installer via tauri-action and attaches it to a draft
# GitHub Release. The release stays a draft until you review the
# bundled artifacts and click Publish — that's deliberate so a
# mistakenly-pushed tag doesn't blast a half-baked build out to users.
#
# Bifrost is Windows-only (Sandboxie is a Windows kernel driver), so
# this workflow only builds for `windows-latest`.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual button in the Actions tab. Useful for dry-runs and for
    # cutting a build off `main` without bumping the tag.
    inputs:
      version:
        description: "Version tag for the draft release (e.g. v0.1.0)"
        required: true
        default: "v0.0.1"

permissions:
  # tauri-action needs `contents: write` to create / attach to a
  # release. Everything else stays at the default read-only.
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    # Claim the `release` GitHub Environment. This is where the
    # updater-signing secrets live (TAURI_SIGNING_PRIVATE_KEY +
    # TAURI_SIGNING_PRIVATE_KEY_PASSWORD). The environment's
    # deployment-tag rule (`v*.*.*`) means those secrets are only
    # readable when this workflow runs from a release tag — a
    # malicious PR cannot exfiltrate the key by adding a step that
    # echoes it, because PR-triggered runs are not in this
    # environment. See docs/RELEASING.md for the one-time setup.
    environment: release
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + draft release
        # SHA-pinned to the v0 tag commit (2025-10-15). The release
        # workflow has `contents: write` + the updater signing
        # secrets in scope, so a tag-takeover on tauri-apps/tauri-
        # action could silently swap a malicious build into our
        # signed release. Dependabot updates this pin when the
        # action ships a new tag.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — see docs/RELEASING.md for one-time
          # setup. Both secrets MUST be configured in the repo's
          # Actions settings before the first signed release;
          # without them, tauri-action will skip the latest.json
          # generation and existing installs can't auto-update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "Bifrost ${{ steps.tag.outputs.tag }}"
          releaseBody: |
            See [`CHANGELOG.md`](./CHANGELOG.md) for the full list of
            changes.

            **Install:** download `Bifrost_*_x64-setup.exe`, run, accept
            the one Windows UAC prompt for the bundled Sandboxie
            install if you don't already have it.

            **Auto-update:** existing Bifrost installs that have this
            release's pubkey baked in will pick this up automatically
            via the in-app banner.
          releaseDraft: true
          prerelease: false
          # `--bundles nsis` restricts to the single Windows target
          # we ship; the `updater` artifacts are produced as a side-
          # effect of `bundle.createUpdaterArtifacts: true` in
          # tauri.conf.json (Tauri 2's declarative replacement for
          # the Tauri-1 `--bundles updater` pseudo-target).
          #
          # Why we DON'T pass `--bundles nsis,updater`: Tauri 2's
          # CLI interprets that combo as a request for "all
          # available bundles plus updater artifacts" and silently
          # also builds MSI. Two competing `.zip.sig` files then
          # confuse tauri-action's latest.json generator with
          # "Signature not found for the updater JSON", causing it
          # to upload the .exe alone without the signature or the
          # latest.json — which breaks the in-app auto-updater for
          # every install of that release.
          args: --bundles nsis
